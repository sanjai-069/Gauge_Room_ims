<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gauge Room IMS</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* THEME VARIABLES */
:root {
  --bg-main: #f5f7fa;
  --bg-card: #fff;
  --bg-hover: #f8fafc;
  --text-main: #1e293b;
  --text-dark: #374151;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --border-main: #e2e8f0;
  --border-light: #f1f5f9;
  --input-bg: #fff;
  --input-border: #d1d5db;
  --placeholder-color: #cbd5e1;
}

body.dark-mode {
  --bg-main: #0f172a;
  --bg-card: #1e293b;
  --bg-hover: #334155;
  --text-main: #f8fafc;
  --text-dark: #e2e8f0;
  --text-muted: #cbd5e1;
  --text-light: #94a3b8;
  --border-main: #334155;
  --border-light: #475569;
  --input-bg: #0f172a;
  --input-border: #475569;
  --placeholder-color: #64748b;
}

body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); font-size: 14px; transition: background-color 0.3s ease, color 0.3s ease; }

/* LAYOUT */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.header { background: var(--bg-card); border-bottom: 1px solid var(--border-main); padding: 0 24px; height: 56px;
  display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; transition: background-color 0.3s ease; }
.logo { width: 32px; height: 32px; background: #2563eb; border-radius: 8px;
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.app-name { font-size: 16px; font-weight: 700; color: var(--text-main); }
.app-sub { font-size: 11px; color: var(--text-light); margin-top: 1px; }
.hspace { flex: 1; }
.htime { font-size: 12px; color: var(--text-light); }
.ubadge { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
  background: var(--bg-hover); border: 1px solid var(--border-main); border-radius: 8px; }
.uav { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0; }
.uav-a { background: #ede9fe; color: #7c3aed; }
.uav-d { background: #dcfce7; color: #16a34a; }
.uname { font-size: 13px; font-weight: 600; color: var(--text-main); }
.urole { font-size: 10px; color: var(--text-light); }
.logout-btn { background: none; border: 1px solid var(--border-main); border-radius: 7px; color: var(--text-light);
  padding: 5px 10px; cursor: pointer; font-size: 11px; font-family: 'Inter', sans-serif;
  transition: all .2s; }
.logout-btn:hover { border-color: #fca5a5; color: #dc2626; }
.bell-btn { background: none; border: 1px solid var(--border-main); border-radius: 7px; color: var(--text-light);
  padding: 5px 9px; cursor: pointer; font-size: 13px; transition: all .2s;
  display: flex; align-items: center; gap: 4px; position: relative; }
.bell-btn:hover { border-color: #fbbf24; color: #d97706; }
.bell-btn.on { border-color: #fde68a; background: #fffbeb; color: #d97706; }
.bell-dot { position: absolute; top: -2px; right: -2px; width: 7px; height: 7px;
  background: #dc2626; border-radius: 50%; border: 2px solid var(--bg-card); }
.bell-n { font-size: 11px; font-weight: 700; }

/* NAV */
.nav { background: var(--bg-card); border-bottom: 1px solid var(--border-main); padding: 0 24px; display: flex; overflow-x: auto; transition: background-color 0.3s ease; -ms-overflow-style: none; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nbtn { padding: 10px 14px; background: none; border: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px; color: var(--text-light); font-size: 13px; font-weight: 500; cursor: pointer;
  white-space: nowrap; flex-shrink: 0; transition: all .2s; font-family: 'Inter', sans-serif; }
.nbtn:hover { color: var(--text-muted); }
.nbtn.on { color: #2563eb; border-bottom-color: #2563eb; }
.nbadge { display: inline-block; margin-left: 5px; padding: 1px 5px; border-radius: 20px;
  font-size: 10px; font-weight: 600; }
.nb-red { background: #fee2e2; color: #dc2626; }
.nb-yel { background: #fef3c7; color: #d97706; }

/* MAIN */
.main { flex: 1; padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }

/* CARDS */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; padding: 16px; transition: background-color 0.3s ease; }
.stat-label { font-size: 11px; color: var(--text-light); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.stat-num { font-size: 28px; font-weight: 700; }
.sn-blue { color: #2563eb; } .sn-green { color: #16a34a; } .sn-orange { color: #ea580c; }
.sn-red { color: #dc2626; } .sn-yellow { color: #d97706; } .sn-purple { color: #7c3aed; }

/* CHARTS ROW */
.charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; margin-bottom: 20px; }
.cc { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; padding: 16px; transition: background-color 0.3s ease; }
.cc-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .5px; }
.donut-wrap { display: flex; align-items: center; gap: 16px; }
.dleg { display: flex; flex-direction: column; gap: 7px; flex: 1; }
.dli { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); }
.dld { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { font-size: 11px; color: var(--text-muted); min-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; background: var(--border-light); border-radius: 4px; height: 7px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: #2563eb; }
.bar-count { font-size: 11px; color: var(--text-light); min-width: 16px; text-align: right; }
.calib-list { display: flex; flex-direction: column; gap: 5px; max-height: 160px; overflow-y: auto; }
.ci { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--bg-hover); }
.ci-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ci-name { font-size: 11px; color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ci-days { font-size: 10px; min-width: 52px; text-align: right; }

/* SECTION HDR */
.sh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sh-title { font-size: 13px; font-weight: 600; color: var(--text-dark); }
.sh-line { flex: 1; height: 1px; background: var(--border-main); }
.sh-count { font-size: 11px; color: var(--text-light); }

/* BANNER */
.bnr { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; }
.bnr-r { background: #fef2f2; border: 1px solid #fecaca; }
.bnr-y { background: #fffbeb; border: 1px solid #fde68a; }
.bnr-g { background: #f0fdf4; border: 1px solid #bbf7d0; }
.bnr-b { background: #eff6ff; border: 1px solid #bfdbfe; }
.bnr-ico { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.bnr-body { flex: 1; }
.bnr-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.bt-r { color: #dc2626; } .bt-y { color: #d97706; } .bt-g { color: #16a34a; } .bt-b { color: #2563eb; }
.bnr-text { font-size: 12px; line-height: 1.5; }
.bt-txt-r { color: #991b1b; } .bt-txt-y { color: #92400e; } .bt-txt-g { color: #166534; } .bt-txt-b { color: #1e40af; }

/* TOOLBAR */
.tb { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.tbsearch { flex: 1; min-width: 160px; background: var(--input-bg); border: 1px solid var(--border-main); border-radius: 7px;
  padding: 7px 11px; color: var(--text-main); font-size: 13px; outline: none; font-family: 'Inter', sans-serif; }
.tbsearch:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.tbsearch::placeholder { color: var(--placeholder-color); }
.tbsel { background: var(--input-bg); border: 1px solid var(--border-main); border-radius: 7px;
  padding: 7px 10px; color: var(--text-main); font-size: 13px; outline: none; cursor: pointer;
  font-family: 'Inter', sans-serif; }

/* BUTTONS */
.btn { padding: 7px 14px; border-radius: 7px; border: none; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .18s; display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap; font-family: 'Inter', sans-serif; }
.btn-blue { background: #2563eb; color: #fff; }
.btn-blue:hover { background: #1d4ed8; }
.btn-green { background: #16a34a; color: #fff; }
.btn-green:hover { background: #15803d; }
.btn-yellow { background: #d97706; color: #fff; }
.btn-yellow:hover { background: #b45309; }
.btn-ghost { background: var(--bg-card); color: var(--text-dark); border: 1px solid var(--border-main); }
.btn-ghost:hover { border-color: #93c5fd; color: #2563eb; }
.btn-outline-blue { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
.btn-outline-blue:hover { background: #dbeafe; }
.btn-outline-green { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
.btn-outline-green:hover { background: #dcfce7; }
.btn-xs { padding: 3px 9px; font-size: 11px; }
.btn-sm { padding: 5px 11px; font-size: 12px; }

/* HELPER GRIDS FOR MODALS */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.gap-10 { gap: 10px; }
.gap-12 { gap: 12px; }
.mb-13 { margin-bottom: 13px; }
.mb-4 { margin-bottom: 4px; }
.mb-0 { margin-bottom: 0; }
.flex-row-mob-col { display: flex; gap: 12px; margin-bottom: 12px; }

/* TABLE */
.tw { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; overflow: hidden; overflow-x: auto; transition: background-color 0.3s ease; }
table { width: 100%; border-collapse: collapse; min-width: 650px; }
th { background: var(--bg-hover); padding: 9px 13px; text-align: left; font-size: 11px; font-weight: 600;
  color: var(--text-muted); border-bottom: 1px solid var(--border-main); white-space: nowrap; text-transform: uppercase; letter-spacing: .5px; }
td { padding: 10px 13px; font-size: 13px; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-hover); }

/* PILLS */
.pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
.p-av { background: #dcfce7; color: #15803d; }
.p-is { background: #dbeafe; color: #1d4ed8; }
.p-ov { background: #fee2e2; color: #dc2626; }
.p-re { background: var(--border-light); color: var(--text-muted); }
.p-ac { background: #dbeafe; color: #1d4ed8; }

/* TICKET ROW WITH RIBBON */
.tk-wrap { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; overflow: hidden; transition: background-color 0.3s ease; }
.tk-row { border-bottom: 1px solid var(--border-light); }
.tk-row:last-child { border-bottom: none; }
.tk-main { display: grid; grid-template-columns: 100px 1fr 1fr 100px 130px 120px auto; transition: background .15s; }
.tk-main:hover { background: var(--bg-hover); }
.tkcell { padding: 10px 13px; font-size: 13px; border-right: 1px solid var(--border-light); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.tkcell:last-child { border-right: none; }
.tkh { font-size: 9px; color: var(--text-light); font-weight: 600; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .5px; }
.ribbon { overflow: hidden; transition: max-height .3s ease, opacity .3s; border-top: 1px solid var(--border-light); }
.ribbon.closed { max-height: 0; opacity: 0; pointer-events: none; }
.ribbon.open { max-height: 500px; opacity: 1; }
.rib-inner { display: flex; background: var(--bg-hover); }
.rib-stripe { width: 3px; flex-shrink: 0; }
.rs-r { background: #dc2626; } .rs-y { background: #d97706; } .rs-g { background: #16a34a; }
.rib-body { flex: 1; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.rib-col-title { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }
.rib-dg { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.rdk { font-size: 10px; color: var(--text-light); white-space: nowrap; }
.rdv { font-size: 11px; color: var(--text-dark); word-break: break-word; font-weight: 500; }
.rdv-b { color: #2563eb; } .rdv-p { color: #7c3aed; } .rdv-r { color: #dc2626; }
.rdv-y { color: #d97706; } .rdv-g { color: #16a34a; } .rdv-o { color: #ea580c; }
.atag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;
  border-radius: 20px; font-size: 10px; font-weight: 600; margin: 1px 0; }
.at-r { background: #fee2e2; color: #dc2626; }
.at-y { background: #fef3c7; color: #d97706; }
.at-o { background: #ffedd5; color: #ea580c; }
.at-g { background: #dcfce7; color: #16a34a; }
.rib-toggle { background: none; border: 1px solid var(--border-main); border-radius: 6px; color: var(--text-muted);
  font-size: 11px; cursor: pointer; padding: 3px 8px; font-family: 'Inter', sans-serif;
  transition: all .15s; }
.rib-toggle:hover { border-color: #93c5fd; color: #2563eb; }

/* EMPTY STATE */
.empty-st { display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 50px 20px; background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; gap: 10px; transition: background-color 0.3s ease; }
.empty-ico { font-size: 36px; opacity: .2; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text-muted); }
.empty-sub { font-size: 12px; color: var(--text-light); text-align: center; max-width: 260px; line-height: 1.5; }
.empty-cell { text-align: center; padding: 32px; color: var(--text-light); font-size: 12px; }

/* MODAL */
.mo { position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px; }
.md { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 12px; padding: 24px;
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0,0,0,.12); animation: mIn .2s ease; }
.md-xl { max-width: 680px; }
@keyframes mIn { from { opacity: 0; transform: scale(.97) translateY(-8px); } to { opacity: 1; transform: none; } }
.md-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
.md-close { margin-left: auto; background: none; border: none; color: var(--text-light); font-size: 16px;
  cursor: pointer; padding: 2px 5px; border-radius: 4px; }
.md-close:hover { color: var(--text-dark); }
.fg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fgf { grid-column: 1/-1; }
.fl { display: flex; flex-direction: column; gap: 4px; }
label { font-size: 11px; font-weight: 600; color: var(--text-dark); }
input, select, textarea { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 7px;
  padding: 8px 10px; color: var(--text-main); font-size: 13px; outline: none;
  transition: border-color .15s, box-shadow .15s; width: 100%; font-family: 'Inter', sans-serif; }
input:focus, select:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
input:disabled, select:disabled { background: var(--bg-hover); color: var(--text-light); cursor: not-allowed; }
.md-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.ibox { background: var(--bg-hover); border: 1px solid var(--border-main); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.prev-box { margin-top: 8px; padding: 9px 12px; background: #f0fdf4; border-radius: 7px;
  border: 1px solid #bbf7d0; font-size: 12px; color: #16a34a; }

/* MSG PREVIEW */
.mp-wrap { background: var(--bg-hover); border: 1px solid var(--border-main); border-radius: 8px; overflow: hidden; margin-top: 12px; }
.mp-to { display: flex; align-items: center; gap: 7px; padding: 7px 12px;
  background: var(--bg-card); font-size: 11px; border-bottom: 1px solid var(--border-main); }
.mp-to-lbl { color: var(--text-light); font-weight: 600; text-transform: uppercase; font-size: 10px; }
.mp-to-val { color: #2563eb; font-weight: 600; }
.mp-to-err { color: #dc2626; }
.mp-body { padding: 12px; font-size: 11px; color: var(--text-dark); line-height: 1.7;
  font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-word;
  max-height: 260px; overflow-y: auto; background: var(--bg-card); }

/* SETTINGS */
.ss { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; padding: 18px; margin-bottom: 14px; transition: background-color 0.3s ease; }
.ss-title { font-size: 13px; font-weight: 600; color: var(--text-dark); margin-bottom: 13px; }
.tr { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 12px; background: var(--bg-hover); border: 1px solid var(--border-main); border-radius: 8px; }
.tr + .tr { margin-top: 7px; }
.trl { font-size: 13px; font-weight: 500; }
.trs { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.tgl { position: relative; width: 38px; height: 20px; flex-shrink: 0; }
.tgl input { opacity: 0; width: 0; height: 0; }
.tgl-sl { position: absolute; inset: 0; background: var(--placeholder-color); border-radius: 10px; cursor: pointer; transition: background .2s; }
.tgl-sl::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px;
  background: #fff; border-radius: 50%; transition: transform .2s; }
.tgl input:checked + .tgl-sl { background: #2563eb; }
.tgl input:checked + .tgl-sl::before { transform: translateX(18px); }
.rule-card { padding: 12px; background: var(--bg-hover); border: 1px solid var(--border-main); border-radius: 8px; border-left: 3px solid; }

/* GAUGE CARDS */
.gc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.gc { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; padding: 14px; transition: background-color 0.3s ease; }
.gc-num { font-size: 11px; font-weight: 600; color: #2563eb; margin-bottom: 1px; }
.gc-part { font-size: 10px; color: #7c3aed; margin-bottom: 4px; font-weight: 500; }
.gc-desc { font-size: 13px; font-weight: 500; margin-bottom: 9px; }
.gc-row { display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border-light); }
.gc-row:last-child { border-bottom: none; }
.gc-k { color: var(--text-light); font-size: 10px; font-weight: 600; text-transform: uppercase; }

/* AUDIT */
.ae { display: flex; align-items: center; gap: 12px; padding: 9px 13px; border-bottom: 1px solid var(--border-light); }
.ae:last-child { border-bottom: none; }
.ae:hover { background: var(--bg-hover); }
.ae-time { font-size: 11px; color: var(--text-light); min-width: 145px; flex-shrink: 0; }
.ae-act { font-size: 10px; font-weight: 600; min-width: 82px; flex-shrink: 0; text-transform: uppercase; }
.aa-ISSUED { color: #2563eb; } .aa-RETURNED { color: #16a34a; } .aa-CALIBRATED { color: #d97706; }
.aa-ADDED { color: #7c3aed; } .aa-EDITED { color: #ea580c; } .aa-ALERTED { color: #dc2626; }
.ae-det { font-size: 12px; color: var(--text-muted); flex: 1; }

/* INLINE EDIT */
.ei { background: var(--input-bg); border: 1px solid #93c5fd; border-radius: 5px; padding: 3px 7px; color: var(--text-main); font-size: 11px; outline: none; font-family: 'Inter', sans-serif; }

/* LOGIN */
.pg-login { min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: var(--bg-main); transition: background-color 0.3s ease; }
.login-box { width: 100%; max-width: 420px; animation: mIn .35s ease; }
.login-hdr { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.login-logo { width: 44px; height: 44px; background: #2563eb; border-radius: 11px;
  display: grid; place-items: center; color: #fff; font-size: 20px; }
.login-brand { font-size: 22px; font-weight: 700; color: var(--text-main); }
.login-brand-sub { font-size: 10px; color: var(--text-light); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
.login-card { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 12px; padding: 28px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06); }
.login-title { font-size: 19px; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
.login-sub { font-size: 13px; color: var(--text-light); margin-bottom: 22px; }
.lf { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.lf label { font-size: 12px; font-weight: 600; color: var(--text-dark); }
.lf input { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px;
  padding: 10px 12px; font-size: 14px; outline: none; width: 100%; font-family: 'Inter', sans-serif; color: var(--text-main); }
.lf input:focus { border-color: #93c5fd; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
.lf input::placeholder { color: var(--placeholder-color); }
.login-err { background: #fef2f2; border: 1px solid #fecaca; border-radius: 7px;
  padding: 9px 12px; font-size: 13px; color: #dc2626; margin-bottom: 14px; }
.login-btn { width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none;
  border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all .2s; }
.login-btn:hover { background: #1d4ed8; }
.creds-box { margin-top: 18px; padding: 14px; background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 10px; }
.creds-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 9px; }
.cred-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border-light); }
.cred-row:last-child { border-bottom: none; }
.cbadge { padding: 2px 7px; border-radius: 20px; font-size: 9px; font-weight: 600; white-space: nowrap; }
.cb-admin { background: #ede9fe; color: #7c3aed; }
.cb-dept { background: #dcfce7; color: #16a34a; }
.cred-text { font-size: 12px; color: var(--text-muted); }
.cred-text b { color: var(--text-dark); }

/* TOAST */
.toast-stack { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 9px;
  border: 1px solid; font-size: 12px; pointer-events: all; animation: mIn .25s ease;
  box-shadow: 0 4px 16px rgba(0,0,0,.1); min-width: 250px; max-width: 340px; }
.t-ok { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
.t-em { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
.t-err { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
.t-warn { background: #fffbeb; border-color: #fde68a; color: #d97706; }
.t-ico { font-size: 14px; flex-shrink: 0; }
.t-txt { flex: 1; line-height: 1.4; }
.t-cls { background: none; border: none; color: inherit; opacity: .5; cursor: pointer; font-size: 12px; }

/* MEDIA QUERIES FOR RESPONSIVE DESIGN */
@media(max-width: 900px) {
  .tk-main { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 12px; gap: 12px; }
  .tkcell { border-right: none; padding: 0; align-items: flex-start; }
  .tkcell:last-child { grid-column: 1 / -1; display: flex; flex-direction: row; border-top: 1px solid var(--border-light); padding-top: 12px; margin-top: 4px; align-items: center; justify-content: space-between; }
  .tkcell:last-child .tkh { display: none; }
  .tkcell:last-child .btn { margin-bottom: 0 !important; }
  .rib-body { grid-template-columns: 1fr 1fr; }
}

@media(max-width: 600px) {
  .header { padding: 0 12px; gap: 8px; }
  .app-sub { display: none; }
  .uname, .urole { display: none; }
  .ubadge { padding: 4px; }
  .nav { padding: 0 12px; }
  .main { padding: 12px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .fg { grid-template-columns: 1fr; }
  .md { padding: 16px; margin: 10px; max-height: calc(100vh - 20px); width: calc(100% - 20px); }
  .md-title { font-size: 15px; }
  .rib-body { grid-template-columns: 1fr; }
  .tk-main { grid-template-columns: 1fr 1fr; }
  .tb { flex-direction: column; align-items: stretch; }
  .tbsel { width: 100%; }
  .tb .btn { width: 100%; justify-content: center; }
  .toast-stack { bottom: 10px; left: 10px; right: 10px; }
  .toast { width: auto; max-width: none; }
  .login-box { padding: 0 15px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr !important; }
  .flex-row-mob-col { flex-direction: column; }
}

@media(max-width: 400px) {
  .stat-grid { grid-template-columns: 1fr; }
  .tk-main { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var useState = React.useState;
var useMemo = React.useMemo;
var useEffect = React.useEffect;

// ── CONSTANTS ─────────────────────────────────
var USERS = [
  {username:"admin",          password:"Admin@1234", role:"admin",      displayName:"Administrator",   dept:null},
  {username:"Manufacturing",  password:"12345678",   role:"department", displayName:"Manufacturing",   dept:"Manufacturing"},
  {username:"QualityControl", password:"12345678",   role:"department", displayName:"Quality Control", dept:"Quality Control"},
  {username:"Inspection",     password:"12345678",   role:"department", displayName:"Inspection",      dept:"Inspection"},
  {username:"Maintenance",    password:"12345678",   role:"department", displayName:"Maintenance",     dept:"Maintenance"},
  {username:"RnD",            password:"12345678",   role:"department", displayName:"R&D",             dept:"R&D"},
  {username:"Production",     password:"12345678",   role:"department", displayName:"Production",      dept:"Production"},
  {username:"Engineering",    password:"12345678",   role:"department", displayName:"Engineering",     dept:"Engineering"},
];
var DEPTS = ["Quality Control","Manufacturing","Inspection","Maintenance","R&D","Production","Engineering"];

// ── HELPERS ────────────────────────────────────
function todayStr() { return new Date().toISOString().split("T")[0]; }
function daysUntil(d) { return Math.ceil((new Date(d) - new Date(todayStr())) / 86400000); }
function daysHeld(d) { return Math.ceil((new Date(todayStr()) - new Date(d)) / 86400000); }
function fmtDate(d) { if(!d) return "—"; return new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
function calibColor(d) {
  var n = daysUntil(d);
  if(n < 0) return "#dc2626";
  if(n <= 14) return "#d97706";
  if(n <= 30) return "#ca8a04";
  return "#16a34a";
}
function nowTs() { return new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}); }
function initials(n) { return n.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase(); }

// ── FIX #1: doCSV — removed stray "; " suffix, added quote escaping ──
function doCSV(data, fn) {
  var keys = Object.keys(data[0]);
  var csv = [keys.join(",")].concat(data.map(function(r){
    return keys.map(function(k){
      return '"' + String(r[k] != null ? r[k] : "").replace(/"/g, '""') + '"';
    }).join(",");
  })).join("\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = fn; a.click();
}

// ── ALERT STATUS ───────────────────────────────
function getAlertStatus(ticket, gauge) {
  if(!gauge || ticket.status === "returned") return {calib:"ok",ret:"ok",sev:"ok", isQtyLimit:false, isQtyWarning:false, remaining:0};
  var cd = daysUntil(gauge.nextCalibrationDate);
  var hd = daysHeld(ticket.issuedDate);

  var max = parseInt(gauge.maxQtyLimit) || 1000;
  var used = parseInt(gauge.usedQty) || 0;
  var remaining = max - used;

  var isQtyLimit = remaining <= 0;
  var isQtyWarning = remaining > 0 && remaining <= (max * 0.1);

  var calib = (cd < 0 || isQtyLimit) ? "overdue" : ((cd <= 14 || isQtyWarning) ? "soon" : "ok");
  var ret = hd > 60 ? "critical" : (hd > 30 ? "warn" : "ok");
  var sev = (calib==="overdue"||ret==="critical") ? "danger" : ((calib==="soon"||ret==="warn") ? "warn" : "ok");

  return {calib:calib, ret:ret, sev:sev, calibDays:cd, heldDays:hd, isQtyLimit:isQtyLimit, isQtyWarning:isQtyWarning, remaining:remaining};
}

// ── MESSAGE BUILDERS ───────────────────────────
function buildEmail(gauge, ticket, type) {
  var hd = daysHeld(ticket.issuedDate);
  var cd = daysUntil(gauge.nextCalibrationDate);
  var pn = gauge.partNumber || "N/A";
  var sep = "----------------------------------------------";
  var header, action;

  var max = parseInt(gauge.maxQtyLimit) || 1000;
  var used = parseInt(gauge.usedQty) || 0;
  var remaining = max - used;
  var isQtyLimit = remaining <= 0;

  if(type === "return") {
    header = "GAUGE RETURN REMINDER";
    action = "Please ensure " + ticket.entityName + " (" + ticket.employeeId + ")\nreturns this gauge to the Gauge Room immediately.\nDays held: " + hd;
  } else {
    header = (cd < 0 || isQtyLimit) ? "CALIBRATION OVERDUE — ACTION REQUIRED" : "CALIBRATION DUE SOON";
    var s = isQtyLimit ? "QTY LIMIT REACHED ("+remaining+" remaining)" :
            (cd < 0 ? "OVERDUE by " + Math.abs(cd) + " day(s)" : (cd === 0 ? "DUE TODAY" : "Due in " + cd + " day(s)"));
    action = "Schedule recalibration for Gauge " + gauge.gaugeNumber + " / Part " + pn + ".\nStatus: " + s;
  }
  return header + "\n" + sep + "\n\n" +
    "Ticket ID    : " + ticket.id + "\n" +
    "Issued Date  : " + fmtDate(ticket.issuedDate) + "\n" +
    "Days Held    : " + hd + " day(s)\n" +
    "Qty Inspected: " + (ticket.qtyInspected || "—") + "\n\n" +
    sep + "\nGAUGE DETAILS\n" + sep + "\n" +
    "Gauge Number : " + gauge.gaugeNumber + "\n" +
    "Part Number  : " + pn + "\n" +
    "Description  : " + gauge.description + "\n" +
    "Location     : " + (gauge.location || "—") + "\n" +
    "Remaining Qty: " + remaining + " pcs (Max: " + max + ")\n" +
    "Last Calib.  : " + fmtDate(gauge.lastCalibrationDate) + "\n" +
    "Next Due     : " + fmtDate(gauge.nextCalibrationDate) + "\n\n" +
    sep + "\nISSUED TO\n" + sep + "\n" +
    "Name         : " + ticket.entityName + "\n" +
    "Employee ID  : " + ticket.employeeId + "\n" +
    "Department   : " + ticket.department + "\n\n" +
    sep + "\nACTION REQUIRED\n" + sep + "\n" +
    action + "\n\nRegards,\nGauge Room IMS";
}

// ── DONUT CHART (pure SVG) ─────────────────────
function DonutChart(props) {
  var segs = props.segments;
  var R=42, cx=52, cy=52, sw=12, circ=2*Math.PI*R;
  var realTotal = segs.reduce(function(s,x){return s+x.v;},0);
  var calcTotal = realTotal || 1;
  var cum = 0;
  return React.createElement("svg", {width:104,height:104,viewBox:"0 0 104 104"},
    React.createElement("circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:"var(--border-light)",strokeWidth:sw}),
    segs.map(function(seg,i) {
      var dash=(seg.v/calcTotal)*circ, off=circ-cum*circ/calcTotal; cum+=seg.v;
      return React.createElement("circle",{key:i,cx:cx,cy:cy,r:R,fill:"none",stroke:seg.c,strokeWidth:sw,
        strokeDasharray:dash+" "+(circ-dash),strokeDashoffset:off,
        style:{transform:"rotate(-90deg)",transformOrigin:"50% 50%"}});
    }),
    React.createElement("text",{x:cx,y:cy+5,textAnchor:"middle",fill:"var(--text-main)",fontFamily:"Inter,sans-serif",fontSize:"18",fontWeight:"700"},realTotal)
  );
}

// ── TOAST ──────────────────────────────────────
function ToastStack(props) {
  return (
    <div className="toast-stack">
      {props.toasts.map(function(t) {
        return (
          <div key={t.id} className={"toast t-"+t.type}>
            <span className="t-ico">{t.icon}</span>
            <span className="t-txt">{t.text}</span>
            <button className="t-cls" onClick={function(){props.onRemove(t.id);}}>✕</button>
          </div>
        );
      })}
    </div>
  );
}

// ── ALERT MODAL ────────────────────────────────
function AlertModal(props) {
  var g = props.gauge, t = props.ticket, at = props.atype;
  var hd = daysHeld(t.issuedDate);
  var targetEmail = t.email || props.settings.email;

  var remaining = g ? (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0) : 0;
  var max = g ? (parseInt(g.maxQtyLimit)||1000) : 0;

  return (
    <div className="mo" onClick={props.onClose}>
      <div className="md md-xl" onClick={function(e){e.stopPropagation();}}>
        <div className="md-title">
          Alert Message — {at==="return"?"Return Reminder":"Calibration Alert"}
          <button className="md-close" onClick={props.onClose}>✕</button>
        </div>

        <div className="grid-2 gap-10 mb-13">
          <div className="ibox mb-0">
            <div style={{fontSize:10,fontWeight:600,color:"var(--text-light)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:7}}>Ticket Info</div>
            <div style={{fontSize:12,fontWeight:700,color:"#2563eb",marginBottom:4}}>{t.id}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <tbody>
                {[["Entity",t.entityName],["Emp ID",t.employeeId],["Dept",t.department],["Issued",fmtDate(t.issuedDate)],["Held",hd+" days"]].map(function(r){
                  return <tr key={r[0]}><td style={{color:"var(--text-light)",paddingRight:8,paddingBottom:2,whiteSpace:"nowrap"}}>{r[0]}</td><td style={{color:"var(--text-dark)",fontWeight:500}}>{r[1]}</td></tr>;
                })}
              </tbody>
            </table>
          </div>
          <div className="ibox mb-0">
            <div style={{fontSize:10,fontWeight:600,color:"var(--text-light)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:7}}>Gauge Info</div>
            <div style={{fontSize:12,fontWeight:700,color:"#2563eb",marginBottom:2}}>{g.gaugeNumber}</div>
            <div style={{fontSize:11,fontWeight:600,color:"#7c3aed",marginBottom:5}}>Part No: {g.partNumber||"—"}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <tbody>
                {[["Desc",g.description],["Remaining Qty",remaining+" / "+max],["Cycle",g.calibrationCycleDays+"d"],["Next Due",fmtDate(g.nextCalibrationDate)]].map(function(r){
                  return <tr key={r[0]}><td style={{color:"var(--text-light)",paddingRight:8,paddingBottom:2,whiteSpace:"nowrap"}}>{r[0]}</td><td style={{color:"var(--text-dark)",fontWeight:500}}>{r[1]}</td></tr>;
                })}
              </tbody>
            </table>
          </div>
        </div>

        <div className="mp-wrap">
          <div className="mp-to">
            <span className="mp-to-lbl">To:</span>
            {targetEmail
              ? <span className="mp-to-val">{targetEmail}</span>
              : <span className="mp-to-err">No email configured for this ticket or in Settings</span>
            }
          </div>
          <div className="mp-body">{buildEmail(g,t,at)}</div>
        </div>

        <div className="md-actions">
          <button className="btn btn-ghost" onClick={props.onClose}>Close</button>
          <button className="btn btn-outline-blue" onClick={function(){props.onEmail(g,t,at,targetEmail);props.onClose();}}>📧 Open Email Client</button>
        </div>
      </div>
    </div>
  );
}

// ── TICKET ROW WITH RIBBON ─────────────────────
function TicketRow(props) {
  var ticket = props.ticket, gauge = props.gauge;
  var ribS = useState(false);
  var isOpen = ribS[0], setOpen = ribS[1];
  var alert = getAlertStatus(ticket, gauge);
  var hd = ticket.status==="active" ? daysHeld(ticket.issuedDate) : null;
  var cd = gauge ? daysUntil(gauge.nextCalibrationDate) : null;

  var stripeClass = alert.sev==="danger" ? "rs-r" : alert.sev==="warn" ? "rs-y" : "rs-g";

  var tags = [];
  if(ticket.status==="active" && gauge) {
    if(alert.isQtyLimit) {
        tags.push({label:"0 Qty Remaining (Calib Req)", cls:"at-r", ico:"🛑"});
    } else if (alert.isQtyWarning) {
        tags.push({label:alert.remaining + " Qty Left", cls:"at-y", ico:"⚠️"});
    }

    if(cd !== null && cd < 0) tags.push({label:"Calib Overdue "+Math.abs(cd)+"d", cls:"at-r", ico:"🚨"});
    else if(cd !== null && cd <= 14) tags.push({label:"Calib Due "+cd+"d", cls:"at-y", ico:"⚠"});

    if(!alert.isQtyLimit && !alert.isQtyWarning && cd > 14) tags.push({label:"Calib OK", cls:"at-g", ico:"✓"});

    if(alert.ret==="critical")    tags.push({label:"Return Critical "+hd+"d",         cls:"at-r", ico:"🔴"});
    else if(alert.ret==="warn")   tags.push({label:"Return Overdue "+hd+"d",          cls:"at-o", ico:"↩"});
    else                          tags.push({label:hd+"d held",                       cls:"at-g", ico:"📅"});
  }
  if(ticket.status==="returned") tags.push({label:"Returned", cls:"at-g", ico:"✓"});

  var hasAlert = ticket.status==="active" && (alert.calib!=="ok" || alert.ret!=="ok");
  var ccol = (ticket.status==="active" && gauge && cd !== null) ? calibColor(gauge.nextCalibrationDate) : "var(--text-light)";

  return (
    <div className="tk-row">
      <div className="tk-main">
        <div className="tkcell">
          <div className="tkh">Ticket</div>
          <div style={{fontSize:11,fontWeight:700,color:"#2563eb"}}>{ticket.id}</div>
          <span className={"pill "+(ticket.status==="active"?"p-ac":ticket.status==="returned"?"p-re":"p-is")} style={{marginTop:3}}>{ticket.status}</span>
        </div>
        <div className="tkcell">
          <div className="tkh">Gauge / Part</div>
          <div style={{fontSize:11,fontWeight:700,color:"#2563eb"}}>{ticket.gaugeNumber}</div>
          {ticket.partNumber && <div style={{fontSize:10,color:"#7c3aed",fontWeight:600}}>Part: {ticket.partNumber}</div>}
          <div style={{fontSize:12,color:"var(--text-muted)",marginTop:2}}>{ticket.gaugeDesc}</div>
        </div>
        <div className="tkcell">
          <div className="tkh">Requested By</div>
          <div style={{fontWeight:600}}>{ticket.entityName}</div>
          <div style={{fontSize:11,color:"var(--text-muted)"}}>{ticket.employeeId}</div>
          <div style={{fontSize:11,color:"var(--text-light)"}}>{ticket.department}</div>
        </div>
        <div className="tkcell">
          <div className="tkh">Issued</div>
          <div style={{fontSize:12}}>{fmtDate(ticket.issuedDate)}</div>
          {hd!==null && <div style={{fontSize:11,color:hd>30?"#ea580c":"var(--text-light)",marginTop:2}}>{hd}d held</div>}
          {ticket.returnedDate && <div style={{fontSize:11,color:"#16a34a",marginTop:2}}>{fmtDate(ticket.returnedDate)}</div>}
        </div>
        <div className="tkcell">
          <div className="tkh">Calibration</div>
          {gauge ? (
            <div>
              <div style={{fontSize:11,color:alert.isQtyLimit?"#dc2626":ccol,fontWeight:600}}>
                {alert.isQtyLimit ? "Limit Reached" : fmtDate(gauge.nextCalibrationDate)}
              </div>
              {ticket.status==="active" && !alert.isQtyLimit && <div style={{fontSize:11,color:ccol,marginTop:2}}>{cd<0?Math.abs(cd)+"d overdue":cd===0?"Due today":cd+"d left"}</div>}
            </div>
          ) : <span style={{color:"var(--text-light)"}}>—</span>}
        </div>
        <div className="tkcell" style={{gap:3}}>
          <div className="tkh">Alerts</div>
          {tags.map(function(t,i){ return <span key={i} className={"atag "+t.cls}>{t.ico} {t.label}</span>; })}
        </div>
        <div className="tkcell">
          <div className="tkh">Actions</div>
          {ticket.status==="active" && props.isAdmin && <button className="btn btn-green btn-xs" style={{marginBottom:5}} onClick={function(){props.onReturn(ticket);}}>↩ Return</button>}
          <button className="rib-toggle" onClick={function(){setOpen(!isOpen);}}>
            {isOpen ? "▲ Hide" : "▼ Details"}
          </button>
        </div>
      </div>

      <div className={"ribbon "+(isOpen?"open":"closed")}>
        <div className="rib-inner">
          <div className={"rib-stripe "+stripeClass}></div>
          <div className="rib-body">
            <div>
              <div className="rib-col-title">Gauge Information</div>
              <div className="rib-dg">
                <span className="rdk">Gauge No.</span><span className="rdv rdv-b">{ticket.gaugeNumber}</span>
                <span className="rdk">Part No.</span><span className="rdv rdv-p">{ticket.partNumber||(gauge&&gauge.partNumber)||"—"}</span>
                <span className="rdk">Description</span><span className="rdv">{ticket.gaugeDesc}</span>
                <span className="rdk">Location</span><span className="rdv">{gauge?(gauge.location||"—"):"—"}</span>
                <span className="rdk">Remaining Qty</span><span className="rdv" style={{color:alert.isQtyLimit?"#dc2626":"inherit", fontWeight:600}}>{gauge?alert.remaining+" / "+(gauge.maxQtyLimit||1000):"—"}</span>
                <span className="rdk">Cycle</span><span className="rdv">{gauge?gauge.calibrationCycleDays+"d":"—"}</span>
                <span className="rdk">Last Calib.</span><span className="rdv">{gauge?fmtDate(gauge.lastCalibrationDate):"—"}</span>
                <span className="rdk">Next Due</span><span className="rdv" style={{color:ccol,fontWeight:600}}>{gauge?fmtDate(gauge.nextCalibrationDate):"—"}</span>
              </div>
            </div>
            <div>
              <div className="rib-col-title">Ticket &amp; Entity</div>
              <div className="rib-dg">
                <span className="rdk">Ticket ID</span><span className="rdv rdv-b">{ticket.id}</span>
                <span className="rdk">Entity</span><span className="rdv">{ticket.entityName}</span>
                <span className="rdk">Emp ID</span><span className="rdv rdv-b">{ticket.employeeId}</span>
                <span className="rdk">Email</span><span className="rdv">{ticket.email||"—"}</span>
                <span className="rdk">Department</span><span className="rdv">{ticket.department}</span>
                <span className="rdk">Qty Inspected</span><span className="rdv rdv-p">{ticket.qtyInspected||"—"}</span>
                <span className="rdk">Issued</span><span className="rdv">{fmtDate(ticket.issuedDate)}</span>
                {ticket.returnedDate && <span className="rdk">Returned</span>}
                {ticket.returnedDate && <span className="rdv rdv-g">{fmtDate(ticket.returnedDate)}</span>}
                {hd!==null && <span className="rdk">Days Held</span>}
                {hd!==null && <span className="rdv" style={{color:hd>60?"#dc2626":hd>30?"#ea580c":"var(--text-dark)",fontWeight:600}}>{hd} day{hd!==1?"s":""}</span>}
              </div>
            </div>
            {ticket.status==="active" && props.isAdmin && (
              <div>
                <div className="rib-col-title">Alert Status</div>
                <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
                  {tags.map(function(t,i){ return <span key={i} className={"atag "+t.cls}>{t.ico} {t.label}</span>; })}
                </div>
                <div className="rib-col-title" style={{marginTop:8}}>Send Notifications</div>
                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                  {alert.calib !== "ok" && <button className="btn btn-outline-blue btn-xs" onClick={function(){props.onAlert(gauge,ticket,"calib");}}>📧 Email — Calib Alert</button>}
                  {alert.ret !== "ok" && <button className="btn btn-outline-blue btn-xs" onClick={function(){props.onAlert(gauge,ticket,"return");}}>📧 Email — Return Reminder</button>}
                  {!hasAlert && <span style={{fontSize:11,color:"#16a34a",fontWeight:500}}>✓ No alerts for this ticket</span>}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── LOGIN PAGE ─────────────────────────────────
function LoginPage(props) {
  var us=useState(""),ps=useState(""),es=useState(""),ss=useState(false);
  var u=us[0],setU=us[1],p=ps[0],setP=ps[1],err=es[0],setErr=es[1],show=ss[0],setShow=ss[1];
  function submit(e) {
    e.preventDefault();
    var found = USERS.filter(function(x){return x.username===u.trim()&&x.password===p;})[0];
    if(!found){setErr("Invalid User ID or Password.");return;}
    props.onLogin(found);
  }
  return (
    <div className="pg-login">
      <button type="button" onClick={props.toggleTheme} style={{position:"absolute", top:20, right:20, background:"var(--bg-card)", border:"1px solid var(--border-main)", borderRadius:8, padding:"8px 12px", cursor:"pointer", color:"var(--text-main)", display:"flex", alignItems:"center", gap:6, fontWeight:600}}>
        {props.isDark ? "☀️ Light" : "🌙 Dark"}
      </button>

      <div className="login-box">
        <div className="login-hdr">
          <div className="login-logo">⊙</div>
          <div>
            <div className="login-brand">Gauge Room IMS</div>
            <div className="login-brand-sub">Inventory Management System</div>
          </div>
        </div>
        <div className="login-card">
          <div className="login-title">Sign in</div>
          <div className="login-sub">Enter your credentials to continue</div>
          {err && <div className="login-err">{err}</div>}
          <form onSubmit={submit}>
            <div className="lf"><label>User ID</label><input value={u} onChange={function(e){setU(e.target.value);}} placeholder="Enter user ID" autoFocus/></div>
            <div className="lf"><label>Password</label>
              <div style={{position:"relative"}}>
                <input type={show?"text":"password"} value={p} onChange={function(e){setP(e.target.value);}} placeholder="Password" style={{paddingRight:36}}/>
                <button type="button" onClick={function(){setShow(!show);}} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--text-light)",cursor:"pointer",fontSize:13}}>{show?"🙈":"👁"}</button>
              </div>
            </div>
            <button type="submit" className="login-btn">Sign in</button>
          </form>
        </div>
        <div className="creds-box">
          <div className="creds-title">System Credentials</div>
          <div className="cred-row"><span className="cbadge cb-admin">Admin</span><span className="cred-text"><b>admin</b> / Admin@1234 — Full access</span></div>
          {[["Manufacturing"],["QualityControl"],["Inspection"],["Maintenance"],["RnD"],["Production"],["Engineering"]].map(function(r){
            return <div key={r[0]} className="cred-row"><span className="cbadge cb-dept">Dept</span><span className="cred-text"><b>{r[0]}</b> / 12345678</span></div>;
          })}
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ───────────────────────────────────
function App() {
  var userS=useState(null); var user=userS[0],setUser=userS[1];
  var gS=useState([]); var gauges=gS[0],setGauges=gS[1];
  var tS=useState([]); var tickets=tS[0],setTickets=tS[1];
  var aS=useState([]); var audit=aS[0],setAudit=aS[1];
  var tabS=useState("dashboard"); var tab=tabS[0],setTab=tabS[1];
  var srS=useState(""); var search=srS[0],setSearch=srS[1];
  var fsS=useState("all"); var fStatus=fsS[0],setFStatus=fsS[1];
  var fdS=useState("all"); var fDept=fdS[0],setFDept=fdS[1];
  var modS=useState(null); var modal=modS[0],setModal=modS[1];
  var sgS=useState(null); var selGauge=sgS[0],setSelGauge=sgS[1];
  var eidS=useState(null); var editId=eidS[0],setEditId=eidS[1];
  var erS=useState({}); var editRow=erS[0],setEditRow=erS[1];
  var toastS=useState([]); var toasts=toastS[0],setToasts=toastS[1];
  var amS=useState(null); var alertModal=amS[0],setAlertModal=amS[1];
  var settS=useState({email:"",emailOn:true,overdueOnly:false});
  var settings=settS[0],setSettings=settS[1];
  var clkS=useState(function(){return new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});});
  var clock=clkS[0],setClock=clkS[1];
  var ifS=useState({gaugeId:"",selectedPartNumber:"",entityName:"",employeeId:"",department:"",email:"",issuedDate:todayStr(),qtyInspected:""});
  var issueF=ifS[0],setIssueF=ifS[1];
  var cfS=useState({lastCalibrationDate:todayStr(),calibrationCycleDays:""});
  var calibF=cfS[0],setCalibF=cfS[1];
  var afS=useState({gaugeNumber:"",partNumber:"",description:"",calibrationCycleDays:"90",lastCalibrationDate:todayStr(),location:"",maxQtyLimit:"1000"});
  var addF=afS[0],setAddF=afS[1];

  // Theme Management
  var [isDark, setIsDark] = useState(function() {
    return localStorage.getItem("theme") === "dark";
  });

  useEffect(function() {
    if (isDark) {
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    } else {
      document.body.classList.remove("dark-mode");
      localStorage.setItem("theme", "light");
    }
  }, [isDark]);

  function toggleTheme() { setIsDark(!isDark); }

  useEffect(function(){
    var t=setInterval(function(){setClock(new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}));},30000);
    return function(){clearInterval(t);};
  },[]);

  function addToast(text,type,icon) {
    var id=Date.now()+Math.random();
    setToasts(function(p){return p.concat([{id:id,text:text,type:type||"ok",icon:icon||"✓"}]);});
    setTimeout(function(){setToasts(function(p){return p.filter(function(t){return t.id!==id;});});},4500);
  }
  function removeToast(id){setToasts(function(p){return p.filter(function(t){return t.id!==id;});});}

  var isAdmin=user&&user.role==="admin";
  var myDept=user&&user.dept;

  var issuedG=gauges.filter(function(g){return g.status==="issued";});

  var availG=gauges.filter(function(g){
    var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    var isOverdue = daysUntil(g.nextCalibrationDate) < 0 || rem <= 0;
    return g.status==="available" && !isOverdue;
  });

  var unavailG=gauges.filter(function(g){
    var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    var isOverdue = daysUntil(g.nextCalibrationDate) < 0 || rem <= 0;
    return g.status==="available" && isOverdue;
  });

  var activeT=tickets.filter(function(t){return t.status==="active";});
  var myTickets=tickets.filter(function(t){return t.department===myDept;});
  var myActive=myTickets.filter(function(t){return t.status==="active";});
  var myGaugeIds={};
  myActive.forEach(function(t){myGaugeIds[t.gaugeId]=true;});
  var myIssuedG=gauges.filter(function(g){return myGaugeIds[g.id];});

  var overdueG=gauges.filter(function(g){
    var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    return g.status!=="issued" && (daysUntil(g.nextCalibrationDate)<0 || rem <= 0);
  });

  var dueSoonG=gauges.filter(function(g){
    var d=daysUntil(g.nextCalibrationDate);
    var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    return g.status!=="issued" && rem > 0 && ((d>=0&&d<=14) || rem <= ((parseInt(g.maxQtyLimit)||1000)*0.1));
  });

  var alertTickets=activeT.filter(function(t){
    var g=gauges.filter(function(x){return x.id===t.gaugeId;})[0];
    return g && getAlertStatus(t,g).sev!=="ok";
  });
  var totalAlerts=alertTickets.length;

  var deptCounts=useMemo(function(){
    var m={};
    activeT.forEach(function(t){m[t.department]=(m[t.department]||0)+1;});
    return Object.entries(m).sort(function(a,b){return b[1]-a[1];});
  },[activeT]);

  var calibSorted=useMemo(function(){
    return gauges.slice().sort(function(a,b){return new Date(a.nextCalibrationDate)-new Date(b.nextCalibrationDate);}).slice(0,6);
  },[gauges]);

  // ── FIX Minor A: Cleaner fStatus filter logic ──
  var filteredG=useMemo(function(){
    return gauges.filter(function(g){
      var s=search.toLowerCase();
      var ms=!search||g.gaugeNumber.toLowerCase().includes(s)||g.description.toLowerCase().includes(s)||(g.partNumber&&g.partNumber.toLowerCase().includes(s))||g.location.toLowerCase().includes(s);
      var mf;
      if(fStatus === "overdue") {
        var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
        mf = (daysUntil(g.nextCalibrationDate)<0 || rem <= 0) && g.status!=="issued";
      } else {
        mf = fStatus==="all" || g.status===fStatus;
      }
      return ms&&mf;
    });
  },[gauges,search,fStatus]);

  var filteredT=useMemo(function(){
    var base=isAdmin?tickets:myTickets;
    return base.filter(function(t){
      var s=search.toLowerCase();
      var ms=!search||t.entityName.toLowerCase().includes(s)||t.gaugeNumber.toLowerCase().includes(s)||t.employeeId.toLowerCase().includes(s)||(t.partNumber&&t.partNumber.toLowerCase().includes(s));
      return ms&&(fDept==="all"||t.department===fDept)&&(fStatus==="all"||t.status===fStatus);
    });
  },[tickets,myTickets,search,fDept,fStatus,isAdmin]);

  var previewCalib=useMemo(function(){
    if(!calibF.lastCalibrationDate||!calibF.calibrationCycleDays) return null;
    var d=new Date(calibF.lastCalibrationDate);
    d.setDate(d.getDate()+parseInt(calibF.calibrationCycleDays));
    return d.toISOString().split("T")[0];
  },[calibF]);

  // Dashboard Variables
  var calibOkG = gauges.filter(function(g){
    var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    return daysUntil(g.nextCalibrationDate) > 14 && rem > ((parseInt(g.maxQtyLimit)||1000)*0.1);
  }).length;

  var dueSoonAllG = gauges.filter(function(g){
    var d = daysUntil(g.nextCalibrationDate);
    var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    return rem > 0 && ((d >= 0 && d <= 14) || rem <= ((parseInt(g.maxQtyLimit)||1000)*0.1));
  }).length;

  var overdueAllG = gauges.filter(function(g){
    var rem = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    return daysUntil(g.nextCalibrationDate) < 0 || rem <= 0;
  }).length;

  function log(action,details){setAudit(function(p){return [{id:p.length+1,timestamp:nowTs(),action:action,details:details}].concat(p);});}

  // ── FIX #2: handleIssue — qty overflow & zero validation ──
  function handleIssue() {
    var gaugeId=issueF.gaugeId,en=issueF.entityName,eid=issueF.employeeId,dept=issueF.department,email=issueF.email,idate=issueF.issuedDate,qtyInsp=issueF.qtyInspected;
    if(!gaugeId||!en||!eid||!dept||!email||!idate||!qtyInsp){addToast("Fill all required fields.","err","!");return;}

    var g=gauges.filter(function(x){return x.id===gaugeId;})[0];
    var qtyToInspect = parseInt(qtyInsp) || 0;

    if(qtyToInspect <= 0){
      addToast("Quantity must be greater than 0.","err","!");
      return;
    }

    var remaining = (parseInt(g.maxQtyLimit)||1000) - (parseInt(g.usedQty)||0);
    if(qtyToInspect > remaining){
      addToast("Qty ("+qtyToInspect+") exceeds remaining capacity ("+remaining+").","err","!");
      return;
    }

    var tid="TKT-"+("000"+(tickets.length+1)).slice(-4);

    setTickets(function(p){return p.concat([{id:tid,gaugeId:gaugeId,gaugeNumber:g.gaugeNumber,partNumber:g.partNumber||"",gaugeDesc:g.description,entityName:en,employeeId:eid,department:dept,email:email,issuedDate:idate,qtyInspected:qtyInsp,returnedDate:null,status:"active"}]);});
    setGauges(function(p){return p.map(function(x){return x.id===gaugeId?Object.assign({},x,{status:"issued", usedQty: (parseInt(x.usedQty)||0) + qtyToInspect}):x;});});

    log("ISSUED",g.gaugeNumber+(g.partNumber?" [Part:"+g.partNumber+"]":"")+" → "+en+" ("+eid+") | "+dept+" | "+tid);
    addToast(tid+" raised for "+g.gaugeNumber,"ok","📋");
    setModal(null);
    setIssueF({gaugeId:"",selectedPartNumber:"",entityName:"",employeeId:"",department:isAdmin?"":myDept,email:"",issuedDate:todayStr(),qtyInspected:""});
  }

  function handleReturn(ticket) {
    setTickets(function(p){return p.map(function(t){return t.id===ticket.id?Object.assign({},t,{status:"returned",returnedDate:todayStr()}):t;});});
    setGauges(function(p){return p.map(function(g){return g.id===ticket.gaugeId?Object.assign({},g,{status:"available"}):g;});});
    log("RETURNED",ticket.gaugeNumber+(ticket.partNumber?" [Part:"+ticket.partNumber+"]":"")+" returned by "+ticket.entityName+" | "+ticket.id);
    addToast(ticket.gaugeNumber+" returned","ok","✓");
  }

  function handleCalib() {
    if(!calibF.lastCalibrationDate||!calibF.calibrationCycleDays){addToast("Fill all fields.","err","!");return;}
    var cycleDays = parseInt(calibF.calibrationCycleDays);
    if(!cycleDays || cycleDays < 1){addToast("Enter a valid calibration cycle (days ≥ 1).","err","!");return;}
    var next=new Date(calibF.lastCalibrationDate);
    next.setDate(next.getDate()+cycleDays);
    var ns=next.toISOString().split("T")[0];
    setGauges(function(p){return p.map(function(g){return g.id===selGauge.id?Object.assign({},g,{lastCalibrationDate:calibF.lastCalibrationDate,calibrationCycleDays:cycleDays,nextCalibrationDate:ns, usedQty:0}):g;});});
    log("CALIBRATED",selGauge.gaugeNumber+(selGauge.partNumber?" [Part:"+selGauge.partNumber+"]":"")+" recalibrated | Next: "+fmtDate(ns));
    addToast("Calibration updated & limit reset","warn","⚙");
    setModal(null);
  }

  // ── FIX #3: handleAddGauge — cycle days & date validation ──
  function handleAddGauge() {
    if(!addF.gaugeNumber||!addF.description){addToast("Gauge number and description required.","err","!");return;}
    var cycleDays = parseInt(addF.calibrationCycleDays);
    if(!cycleDays || cycleDays < 1){addToast("Enter a valid calibration cycle (days ≥ 1).","err","!");return;}
    if(!addF.lastCalibrationDate){addToast("Last calibration date is required.","err","!");return;}
    var next=new Date(addF.lastCalibrationDate);
    next.setDate(next.getDate()+cycleDays);
    if(isNaN(next.getTime())){addToast("Invalid calibration date.","err","!");return;}
    var newId="G"+("00"+(gauges.length+1)).slice(-3);
    setGauges(function(p){return p.concat([{id:newId,gaugeNumber:addF.gaugeNumber,partNumber:addF.partNumber||"",description:addF.description,calibrationCycleDays:cycleDays,lastCalibrationDate:addF.lastCalibrationDate,nextCalibrationDate:next.toISOString().split("T")[0],status:"available",location:addF.location||"",maxQtyLimit:parseInt(addF.maxQtyLimit)||1000, usedQty:0}]);});
    log("ADDED",addF.gaugeNumber+(addF.partNumber?" [Part:"+addF.partNumber+"]":"")+" — "+addF.description+" added");
    addToast(addF.gaugeNumber+(addF.partNumber?" / "+addF.partNumber:"")+" added","ok","➕");
    setModal(null);
    setAddF({gaugeNumber:"",partNumber:"",description:"",calibrationCycleDays:"90",lastCalibrationDate:todayStr(),location:"",maxQtyLimit:"1000"});
  }

  function startEdit(g){setEditId(g.id);setEditRow({gaugeNumber:g.gaugeNumber,partNumber:g.partNumber||"",description:g.description,location:g.location||"",maxQtyLimit:String(g.maxQtyLimit||1000),calibrationCycleDays:String(g.calibrationCycleDays)});}
  function saveEdit(g) {
    if(!editRow.gaugeNumber||!editRow.description){addToast("Required fields missing.","err","!");return;}
    var cycleDays = parseInt(editRow.calibrationCycleDays || g.calibrationCycleDays);
    if(!cycleDays || cycleDays < 1){addToast("Enter a valid calibration cycle (days ≥ 1).","err","!");return;}
    var next=new Date(g.lastCalibrationDate);
    next.setDate(next.getDate()+cycleDays);
    setGauges(function(p){return p.map(function(x){return x.id===g.id?Object.assign({},x,{gaugeNumber:editRow.gaugeNumber,partNumber:editRow.partNumber,description:editRow.description,location:editRow.location,maxQtyLimit:parseInt(editRow.maxQtyLimit)||1000,calibrationCycleDays:cycleDays,nextCalibrationDate:next.toISOString().split("T")[0]}):x;});});
    log("EDITED",g.gaugeNumber+" → "+editRow.gaugeNumber+(editRow.partNumber?" [Part:"+editRow.partNumber+"]":""));
    addToast(editRow.gaugeNumber+" updated","ok","✓");
    setEditId(null);
  }

  function sendEmail(gauge,ticket,atype,targetEmail) {
    var em = targetEmail || ticket.email || settings.email;
    if(!em){addToast("No email configured","err","!");return;}
    var subj=atype==="return"?"GAUGE RETURN REMINDER — "+gauge.gaugeNumber+" / Part: "+(gauge.partNumber||"N/A"):"CALIBRATION ALERT — "+gauge.gaugeNumber+" / Part: "+(gauge.partNumber||"N/A");
    window.open("mailto:"+em+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(buildEmail(gauge,ticket,atype)),"_blank");
    log("ALERTED","Email → "+em+" | "+gauge.gaugeNumber+(gauge.partNumber?" [Part:"+gauge.partNumber+"]":"")+" | "+ticket.id);
    addToast("Email opened for "+gauge.gaugeNumber,"em","📧");
  }

  function openAlertModal(gauge,ticket,atype){setAlertModal({gauge:gauge,ticket:ticket,atype:atype});}
  function switchTab(t){setTab(t);setSearch("");setFStatus("all");setFDept("all");}
  function openIssue(){setIssueF({gaugeId:"",selectedPartNumber:"",entityName:"",employeeId:"",department:isAdmin?"":myDept,email:"",issuedDate:todayStr(),qtyInspected:""});setModal("issue");}

  if(!user) return <LoginPage onLogin={function(u){setUser(u);setTab("dashboard");}} isDark={isDark} toggleTheme={toggleTheme}/>;

  // ── DEPT VIEW ──────────────────────────────
  if(user.role==="department") return (
    <div className="app">
      <header className="header">
        <div className="logo">⊙</div>
        <div><div className="app-name">Gauge Room IMS</div></div>
        <div className="hspace"/>

        <button className="bell-btn" onClick={toggleTheme} title="Toggle Theme" style={{marginRight: 4}}>
          {isDark ? "☀️" : "🌙"}
        </button>

        <div className="ubadge">
          <div className={"uav uav-d"}>{initials(user.displayName)}</div>
          <div><div className="uname">{user.displayName}</div><div className="urole">Department</div></div>
        </div>
        <button className="logout-btn" onClick={function(){setUser(null);}}>Sign out</button>
      </header>
      <main className="main">
        <div className="bnr bnr-g" style={{marginBottom:16}}>
          <span className="bnr-ico">🏭</span>
          <div className="bnr-body">
            <div className="bnr-title bt-g">{user.displayName} — Department Access</div>
            <div className="bnr-text bt-txt-g">You can raise gauge requests and view your department's tickets. Return access requires admin.</div>
          </div>
        </div>
        <div className="stat-grid">
          <div className="stat-card"><div className="stat-label">Ready to Issue</div><div className="stat-num sn-blue">{availG.length}</div></div>
          <div className="stat-card"><div className="stat-label">My Active Tickets</div><div className="stat-num sn-green">{myActive.length}</div></div>
          <div className="stat-card"><div className="stat-label">Gauges Held</div><div className="stat-num sn-orange">{myIssuedG.length}</div></div>
          <div className="stat-card"><div className="stat-label">Total My Tickets</div><div className="stat-num sn-purple">{myTickets.length}</div></div>
        </div>
        <div style={{display:"flex",gap:10,marginBottom:20,alignItems:"center",flexWrap:"wrap"}}>
          <button className="btn btn-blue" onClick={openIssue}>+ Raise Gauge Request</button>
          <span style={{fontSize:12,color:"var(--text-light)"}}>Gauge limits update automatically upon issuance</span>
        </div>

        <div className="sh"><div className="sh-title">My Active Tickets</div><div className="sh-line"/><div className="sh-count">{myActive.length}</div></div>
        {myActive.length===0
          ?<div className="empty-st" style={{marginBottom:20}}><div className="empty-ico">📋</div><div className="empty-title">No active tickets</div></div>
          :<div className="tk-wrap" style={{marginBottom:20}}>{myActive.map(function(t){var g=gauges.filter(function(x){return x.id===t.gaugeId;})[0];return <TicketRow key={t.id} ticket={t} gauge={g} onReturn={handleReturn} onAlert={openAlertModal} settings={settings} isAdmin={isAdmin}/>;})}</div>
        }

        <div className="sh"><div className="sh-title">Gauges Held by My Department</div><div className="sh-line"/><div className="sh-count">{myIssuedG.length}</div></div>
        {myIssuedG.length===0
          ?<div className="empty-st" style={{marginBottom:20}}><div className="empty-ico">⊙</div><div className="empty-title">No gauges held</div></div>
          :<div className="gc-grid" style={{marginBottom:20}}>{myIssuedG.map(function(g){
            var t=myActive.filter(function(x){return x.gaugeId===g.id;})[0];
            var days=daysUntil(g.nextCalibrationDate),col=calibColor(g.nextCalibrationDate);
            return (
              <div key={g.id} className="gc">
                <div className="gc-num">{g.gaugeNumber}</div>
                {g.partNumber&&<div className="gc-part">Part: {g.partNumber}</div>}
                <div className="gc-desc">{g.description}</div>
                <div>
                  <div className="gc-row"><span className="gc-k">Location</span><span style={{fontSize:12,color:"var(--text-muted)"}}>{g.location||"—"}</span></div>
                  <div className="gc-row"><span className="gc-k">Held by</span><span style={{fontSize:12,fontWeight:500}}>{t?t.entityName:"—"}</span></div>
                  <div className="gc-row"><span className="gc-k">Ticket</span><span style={{fontSize:12,color:"#2563eb",fontWeight:600}}>{t?t.id:"—"}</span></div>
                  <div className="gc-row"><span className="gc-k">Issued</span><span style={{fontSize:12}}>{t?fmtDate(t.issuedDate):"—"}</span></div>
                  <div className="gc-row"><span className="gc-k">Calib Due</span><span style={{fontSize:12,color:col,fontWeight:600}}>{days<0?"OD "+Math.abs(days)+"d":days===0?"Today":days+"d"}</span></div>
                </div>
              </div>
            );
          })}</div>
        }

        <div className="sh"><div className="sh-title">Ticket History</div><div className="sh-line"/><div className="sh-count">{myTickets.length}</div></div>
        {myTickets.length===0
          ?<div className="empty-st"><div className="empty-ico">📜</div><div className="empty-title">No history</div></div>
          :<div className="tk-wrap">{myTickets.map(function(t){var g=gauges.filter(function(x){return x.id===t.gaugeId;})[0];return <TicketRow key={t.id} ticket={t} gauge={g} onReturn={handleReturn} onAlert={openAlertModal} settings={settings} isAdmin={isAdmin}/>;})}</div>
        }
      </main>

      {modal==="issue"&&(
        <div className="mo" onClick={function(){setModal(null);}}>
          <div className="md" onClick={function(e){e.stopPropagation();}}>
            <div className="md-title">Raise Gauge Request <button className="md-close" onClick={function(){setModal(null);}}>✕</button></div>
            <div className="fg">
              <div className="fl fgf">
                <label>① Part Number *</label>
                <select value={issueF.selectedPartNumber} onChange={function(e){setIssueF(Object.assign({},issueF,{selectedPartNumber:e.target.value,gaugeId:""}));}}>
                  <option value="">— Select a part number —</option>
                  {(function(){
                    var parts=[]; var seen={};
                    availG.forEach(function(g){ var pn=g.partNumber||"__NOPART__"; if(!seen[pn]){seen[pn]=true;parts.push(pn);} });
                    return parts.map(function(pn){ return <option key={pn} value={pn}>{pn==="__NOPART__"?"(No Part Number)":pn}</option>; });
                  })()}
                </select>
              </div>
              <div className="fl fgf">
                <label style={{color:issueF.selectedPartNumber?"var(--text-dark)":"var(--text-light)"}}>② Gauge Number *</label>
                <select value={issueF.gaugeId} onChange={function(e){setIssueF(Object.assign({},issueF,{gaugeId:e.target.value}));}} disabled={!issueF.selectedPartNumber} style={{opacity:issueF.selectedPartNumber?1:0.5,cursor:issueF.selectedPartNumber?"pointer":"not-allowed"}}>
                  <option value="">{issueF.selectedPartNumber?"— Select a gauge number —":"— Select part number first —"}</option>
                  {availG.filter(function(g){return (g.partNumber||"__NOPART__")===issueF.selectedPartNumber;}).map(function(g){
                    return <option key={g.id} value={g.id}>{g.gaugeNumber} — {g.description}</option>;
                  })}
                </select>
              </div>
              {issueF.gaugeId&&(function(){
                var sg=gauges.filter(function(x){return x.id===issueF.gaugeId;})[0];
                if(!sg) return null;
                var used = parseInt(sg.usedQty) || 0;
                var max = parseInt(sg.maxQtyLimit) || 1000;
                var remaining = max - used;
                return (
                  <div className="fl fgf">
                    <div className="ibox grid-2 gap-12 mb-4">
                      <div className="fl"><label>Gauge Name (Description)</label><input value={sg.description} disabled style={{backgroundColor:"var(--bg-hover)", fontWeight:500}}/></div>
                      <div className="fl"><label>Gauge Number</label><input value={sg.gaugeNumber} disabled style={{backgroundColor:"var(--bg-hover)", fontWeight:600}}/></div>
                    </div>
                    <div style={{fontSize:11, color: remaining<=0?"#dc2626":"#16a34a", fontWeight:600, paddingLeft:4}}>
                      Remaining Inspection Capacity: {remaining} pcs (Max Limit: {max})
                    </div>
                  </div>
                );
              })()}
              <div className="fl fgf"><label>No. of Quantity Inspection *</label><input type="number" value={issueF.qtyInspected} onChange={function(e){setIssueF(Object.assign({},issueF,{qtyInspected:e.target.value}));}} placeholder="e.g. 500" min="1"/></div>
              <div className="fl"><label>Your Name *</label><input value={issueF.entityName} onChange={function(e){setIssueF(Object.assign({},issueF,{entityName:e.target.value}));}} placeholder="Full name"/></div>
              <div className="fl"><label>Employee ID *</label><input value={issueF.employeeId} onChange={function(e){setIssueF(Object.assign({},issueF,{employeeId:e.target.value}));}} placeholder="EMP-XXXX"/></div>
              <div className="fl fgf"><label>Email *</label><input type="email" value={issueF.email} onChange={function(e){setIssueF(Object.assign({},issueF,{email:e.target.value}));}} placeholder="user@company.com"/></div>
              <div className="fl fgf"><label>Department</label><input value={user.displayName} disabled/></div>
              <div className="fl"><label>Request Date *</label><input type="date" value={issueF.issuedDate} onChange={function(e){setIssueF(Object.assign({},issueF,{issuedDate:e.target.value}));}}/></div>
            </div>
            <div className="md-actions"><button className="btn btn-ghost" onClick={function(){setModal(null);}}>Cancel</button><button className="btn btn-blue" onClick={handleIssue}>Submit Request</button></div>
          </div>
        </div>
      )}
      {alertModal&&<AlertModal gauge={alertModal.gauge} ticket={alertModal.ticket} atype={alertModal.atype} settings={settings} onClose={function(){setAlertModal(null);}} onEmail={sendEmail}/>}
      <ToastStack toasts={toasts} onRemove={removeToast}/>
    </div>
  );

  // ── ADMIN VIEW ─────────────────────────────
  return (
    <div className="app">
      <header className="header">
        <div className="logo">⊙</div>
        <div><div className="app-name">Gauge Room IMS</div><div className="app-sub">Inventory Management</div></div>
        <div className="hspace"/>
        <div className="htime">{clock}</div>

        <button className="bell-btn" onClick={toggleTheme} title="Toggle Theme" style={{marginRight: 4}}>
          {isDark ? "☀️" : "🌙"}
        </button>

        <button className={"bell-btn"+(totalAlerts>0?" on":"")} onClick={function(){switchTab("alerts");}}>
          🔔 <span className="bell-n">{totalAlerts}</span>
          {totalAlerts>0&&<span className="bell-dot"/>}
        </button>
        <div className="ubadge">
          <div className="uav uav-a">AD</div>
          <div><div className="uname">Administrator</div><div className="urole">Admin</div></div>
        </div>
        <button className="logout-btn" onClick={function(){setUser(null);}}>Sign out</button>
      </header>

      <nav className="nav">
        {[{k:"dashboard",l:"Dashboard"},{k:"inventory",l:"Inventory"},{k:"tickets",l:"Tickets",b:activeT.length,br:true},{k:"alerts",l:"Alerts",b:totalAlerts,br:false},{k:"settings",l:"Settings"},{k:"audit",l:"Audit Log"}].map(function(n){
          return <button key={n.k} className={"nbtn"+(tab===n.k?" on":"")} onClick={function(){switchTab(n.k);}}>
            {n.l}{(n.b!=null&&n.b>0)?<span className={"nbadge "+(n.br?"nb-red":"nb-yel")}>{n.b}</span>:null}
          </button>;
        })}
      </nav>

      <main className="main">

        {tab==="dashboard"&&(
          <div>
            {totalAlerts>0&&<div className="bnr bnr-r">
              <span className="bnr-ico">🔔</span>
              <div className="bnr-body">
                <div className="bnr-title bt-r">{totalAlerts} ticket{totalAlerts>1?"s":""} need attention</div>
                <div className="bnr-text bt-txt-r">Click <b>▼ Details</b> on any ticket row to expand the alert ribbon and send email notifications with Gauge No. &amp; Part No.</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={function(){switchTab("alerts");}}>View Alerts</button>
            </div>}

            <div className="stat-grid">
              {[{l:"Total Gauges",v:gauges.length,c:"sn-blue"},{l:"Ready to Issue",v:availG.length,c:"sn-green"},{l:"Issued Out",v:issuedG.length,c:"sn-orange"},{l:"Active Tickets",v:activeT.length,c:"sn-blue"},{l:"Calib. Overdue",v:overdueG.length,c:"sn-red"},{l:"Alert Tickets",v:totalAlerts,c:"sn-yellow"}].map(function(s){
                return <div key={s.l} className="stat-card"><div className="stat-label">{s.l}</div><div className={"stat-num "+s.c}>{s.v}</div></div>;
              })}
            </div>

            <div className="charts-row">
              <div className="cc">
                <div className="cc-title">Issue Status</div>
                <div className="donut-wrap">
                  <DonutChart segments={[{v:availG.length,c:"#16a34a"},{v:issuedG.length,c:"#2563eb"},{v:unavailG.length,c:"#dc2626"}]}/>
                  <div className="dleg">
                    <div className="dli"><div className="dld" style={{background:"#16a34a"}}/><span>Ready to Issue</span><span style={{marginLeft:"auto",color:"#16a34a",fontWeight:600,fontSize:12,paddingLeft:6}}>{availG.length}</span></div>
                    <div className="dli"><div className="dld" style={{background:"#2563eb"}}/><span>Issued</span><span style={{marginLeft:"auto",color:"#2563eb",fontWeight:600,fontSize:12,paddingLeft:6}}>{issuedG.length}</span></div>
                    <div className="dli"><div className="dld" style={{background:"#dc2626"}}/><span>Unavailable (Calib Req)</span><span style={{marginLeft:"auto",color:"#dc2626",fontWeight:600,fontSize:12,paddingLeft:6}}>{unavailG.length}</span></div>
                  </div>
                </div>
              </div>
              <div className="cc">
                <div className="cc-title">Calibration Status</div>
                <div className="donut-wrap">
                  <DonutChart segments={[{v:calibOkG,c:"#16a34a"},{v:dueSoonAllG,c:"#d97706"},{v:overdueAllG,c:"#dc2626"}]}/>
                  <div className="dleg">
                    <div className="dli"><div className="dld" style={{background:"#16a34a"}}/><span>OK</span><span style={{marginLeft:"auto",color:"#16a34a",fontWeight:600,fontSize:12,paddingLeft:6}}>{calibOkG}</span></div>
                    <div className="dli"><div className="dld" style={{background:"#d97706"}}/><span>Due Soon / Low Qty</span><span style={{marginLeft:"auto",color:"#d97706",fontWeight:600,fontSize:12,paddingLeft:6}}>{dueSoonAllG}</span></div>
                    <div className="dli"><div className="dld" style={{background:"#dc2626"}}/><span>Overdue (Limit/Date)</span><span style={{marginLeft:"auto",color:"#dc2626",fontWeight:600,fontSize:12,paddingLeft:6}}>{overdueAllG}</span></div>
                  </div>
                </div>
              </div>
              <div className="cc">
                <div className="cc-title">By Department</div>
                {deptCounts.length===0?<div className="empty-cell">No active issuances</div>
                  :<div className="bar-chart">{deptCounts.map(function(dc){
                    return <div key={dc[0]} className="bar-row"><div className="bar-label" title={dc[0]}>{dc[0]}</div><div className="bar-track"><div className="bar-fill" style={{width:(dc[1]/activeT.length*100)+"%"}}/></div><div className="bar-count">{dc[1]}</div></div>;
                  })}</div>
                }
              </div>
              <div className="cc">
                <div className="cc-title">Calibration Timeline</div>
                {calibSorted.length===0?<div className="empty-cell">No gauges added yet</div>
                  :<div className="calib-list">{calibSorted.map(function(g){
                    var d=daysUntil(g.nextCalibrationDate),col=calibColor(g.nextCalibrationDate);
                    var c=g.status==="issued"?"var(--text-light)":col;
                    return <div key={g.id} className="ci">
                      <div className="ci-dot" style={{background:c}}/>
                      <div className="ci-name" title={g.gaugeNumber+(g.partNumber?" / "+g.partNumber:"")}>{g.gaugeNumber}{g.partNumber?" / "+g.partNumber:""}</div>
                      <div className="ci-days" style={{color:c,fontSize:11,fontWeight:600}}>{d<0?Math.abs(d)+"d OD":d===0?"Today":d+"d"}</div>
                    </div>;
                  })}</div>
                }
              </div>
