            </div>

            <div className="sh"><div className="sh-title">Active Tickets</div><div className="sh-line"/><div className="sh-count">{activeT.length} active</div></div>
            {activeT.length===0
              ?<div className="empty-st"><div className="empty-ico">📋</div><div className="empty-title">No active tickets</div><div className="empty-sub">Issue a gauge to get started</div></div>
              :<div className="tk-wrap">{activeT.slice(0,6).map(function(t){var g=gauges.filter(function(x){return x.id===t.gaugeId;})[0];return <TicketRow key={t.id} ticket={t} gauge={g} onReturn={handleReturn} onAlert={openAlertModal} settings={settings} isAdmin={isAdmin}/>;})}</div>
            }
          </div>
        )}

        {tab==="inventory"&&(
          <div>
            <div className="tb">
              <input className="tbsearch" placeholder="Search gauge number, part number, description…" value={search} onChange={function(e){setSearch(e.target.value);}}/>
              <select className="tbsel" value={fStatus} onChange={function(e){setFStatus(e.target.value);}}>
                <option value="all">All Status</option><option value="available">Available</option><option value="issued">Issued</option><option value="overdue">Overdue Calib.</option>
              </select>
              <button className="btn btn-blue" onClick={openIssue}>+ Issue</button>
              <button className="btn btn-ghost" onClick={function(){setModal("addGauge");}}>+ Add Gauge</button>
              {gauges.length>0&&<button className="btn btn-ghost" onClick={function(){doCSV(gauges,"gauges.csv");}}>↓ Export</button>}
            </div>
            <div className="sh"><div className="sh-title">Gauge Inventory</div><div className="sh-line"/><div className="sh-count">{filteredG.length} records</div></div>
            {gauges.length===0
              ?<div className="empty-st"><div className="empty-ico">⊙</div><div className="empty-title">No gauges added yet</div><div className="empty-sub">Add your first gauge with Gauge No. and Part No. separately</div><button className="btn btn-blue" onClick={function(){setModal("addGauge");}}>+ Add First Gauge</button></div>
              :<div className="tw"><table>
                <thead><tr><th>Gauge No.</th><th>Part No.</th><th>Description</th><th>Location</th><th>Remaining Qty</th><th>Status</th><th>Last Calib.</th><th>Next Calib.</th><th>Cycle</th><th>Actions</th></tr></thead>
                <tbody>{filteredG.map(function(g){
                  var d=daysUntil(g.nextCalibrationDate),col=calibColor(g.nextCalibrationDate),ed=editId===g.id;

                  var max = parseInt(g.maxQtyLimit)||1000;
                  var used = parseInt(g.usedQty)||0;
                  var rem = max - used;
                  var isLimitReached = rem <= 0;
                  var remCol = rem <= 0 ? "#dc2626" : (rem <= max*0.1 ? "#d97706" : "var(--text-muted)");
                  var remWght = rem <= max*0.1 ? 600 : 400;

                  var sk=g.status==="available"&&(d<0||isLimitReached)?"overdue":g.status;
                  var pk=sk==="overdue"?"p-ov":sk==="available"?"p-av":sk==="issued"?"p-is":"p-re";
                  return (
                    <tr key={g.id}>
                      <td>{ed?<input className="ei" value={editRow.gaugeNumber} onChange={function(e){setEditRow(Object.assign({},editRow,{gaugeNumber:e.target.value}));}} style={{width:100}}/>:<span style={{fontSize:12,fontWeight:700,color:"#2563eb"}}>{g.gaugeNumber}</span>}</td>
                      <td>{ed?<input className="ei" value={editRow.partNumber} onChange={function(e){setEditRow(Object.assign({},editRow,{partNumber:e.target.value}));}} style={{width:90}}/>:<span style={{fontSize:12,fontWeight:600,color:"#7c3aed"}}>{g.partNumber||<span style={{color:"var(--placeholder-color)"}}>—</span>}</span>}</td>
                      <td>{ed?<input className="ei" value={editRow.description} onChange={function(e){setEditRow(Object.assign({},editRow,{description:e.target.value}));}} style={{width:145}}/>:g.description}</td>
                      <td>{ed?<input className="ei" value={editRow.location} onChange={function(e){setEditRow(Object.assign({},editRow,{location:e.target.value}));}} style={{width:75}}/>:<span style={{color:"var(--text-muted)",fontSize:12}}>{g.location||"—"}</span>}</td>
                      <td>{ed?<input className="ei" type="number" value={editRow.maxQtyLimit} onChange={function(e){setEditRow(Object.assign({},editRow,{maxQtyLimit:e.target.value}));}} style={{width:60}} min="1"/>:<span style={{color:remCol,fontSize:12, fontWeight:remWght}}>{rem} / {max}</span>}</td>
                      <td><span className={"pill "+pk}>{sk}</span></td>
                      <td style={{fontSize:12,color:"var(--text-muted)"}}>{fmtDate(g.lastCalibrationDate)}</td>
                      <td style={{fontSize:12,color:g.status==="issued"?"var(--text-light)":col,fontWeight:600}}>{fmtDate(g.nextCalibrationDate)}</td>
                      <td>{ed?<input className="ei" type="number" value={editRow.calibrationCycleDays} onChange={function(e){setEditRow(Object.assign({},editRow,{calibrationCycleDays:e.target.value}));}} style={{width:50}} min={1}/>:<span style={{fontSize:12,color:"var(--text-muted)"}}>{g.calibrationCycleDays}d</span>}</td>
                      <td style={{display:"flex",gap:4}}>
                        {ed
                          ?<><button className="btn btn-green btn-xs" onClick={function(){saveEdit(g);}}>Save</button><button className="btn btn-ghost btn-xs" onClick={function(){setEditId(null);}}>Cancel</button></>
                          :<><button className="btn btn-yellow btn-xs" onClick={function(){setSelGauge(g);setCalibF({lastCalibrationDate:g.lastCalibrationDate,calibrationCycleDays:String(g.calibrationCycleDays)});setModal("calib");}}>Calib.</button><button className="btn btn-ghost btn-xs" onClick={function(){startEdit(g);}}>Edit</button></>
                        }
                      </td>
                    </tr>
                  );
                })}
                {filteredG.length===0&&<tr><td colSpan={10} className="empty-cell">No gauges match filter</td></tr>}
                </tbody>
              </table></div>
            }
          </div>
        )}

        {tab==="tickets"&&(
          <div>
            <div className="tb">
              <input className="tbsearch" placeholder="Search by name, gauge no., part no., employee ID…" value={search} onChange={function(e){setSearch(e.target.value);}}/>
              <select className="tbsel" value={fStatus} onChange={function(e){setFStatus(e.target.value);}}>
                <option value="all">All</option><option value="active">Active</option><option value="returned">Returned</option>
              </select>
              <select className="tbsel" value={fDept} onChange={function(e){setFDept(e.target.value);}}>
                <option value="all">All Departments</option>
                {DEPTS.map(function(d){return <option key={d}>{d}</option>;})}
              </select>
              <button className="btn btn-blue" onClick={openIssue}>+ Raise Ticket</button>
              {tickets.length>0&&<button className="btn btn-ghost" onClick={function(){doCSV(tickets,"tickets.csv");}}>↓ Export</button>}
            </div>
            {totalAlerts>0&&fStatus!=="returned"&&<div className="bnr bnr-y" style={{marginBottom:12}}>
              <span className="bnr-ico">💡</span>
              <div className="bnr-body">
                <div className="bnr-title bt-y">Alert ribbons available</div>
                <div className="bnr-text bt-txt-y">Click <b>▼ Details</b> on any ticket to expand its alert ribbon and send email notifications with Gauge No. and Part No.</div>
              </div>
            </div>}
            <div className="sh"><div className="sh-title">All Tickets</div><div className="sh-line"/><div className="sh-count">{filteredT.length} records</div></div>
            {tickets.length===0
              ?<div className="empty-st"><div className="empty-ico">📋</div><div className="empty-title">No tickets yet</div><div className="empty-sub">Raise a ticket to issue a gauge</div><button className="btn btn-blue" onClick={openIssue}>+ Raise First Ticket</button></div>
              :<div className="tk-wrap">
                {filteredT.map(function(t){var g=gauges.filter(function(x){return x.id===t.gaugeId;})[0];return <TicketRow key={t.id} ticket={t} gauge={g} onReturn={handleReturn} onAlert={openAlertModal} settings={settings} isAdmin={isAdmin}/>;})}{filteredT.length===0&&<div className="empty-cell">No tickets match filter</div>}
              </div>
            }
          </div>
        )}

        {tab==="alerts"&&(
          <div>
            {!(settings.email || activeT.some(t => t.email))&&<div className="bnr bnr-b" style={{marginBottom:14}}>
              <span className="bnr-ico">💡</span>
              <div className="bnr-body"><div className="bnr-title bt-b">Configure alert contacts</div><div className="bnr-text bt-txt-b">Provide an email on ticket issuance, or go to <b>Settings</b> to add a default system email.</div></div>
              <button className="btn btn-blue btn-sm" onClick={function(){switchTab("settings");}}>Open Settings</button>
            </div>}
            {settings.email&&<div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12,padding:"8px 12px",background:"var(--bg-card)",border:"1px solid var(--border-main)",borderRadius:8,flexWrap:"wrap"}}>
              <span style={{fontSize:11,fontWeight:600,color:"var(--text-light)",textTransform:"uppercase",letterSpacing:".5px"}}>Default System Alert Contact:</span>
              {settings.email&&<span style={{fontSize:12,fontWeight:600,color:"#2563eb",background:"#eff6ff",padding:"2px 9px",borderRadius:20,border:"1px solid #bfdbfe"}}>📧 {settings.email}</span>}
              <button className="btn btn-ghost btn-xs" style={{marginLeft:"auto"}} onClick={function(){switchTab("settings");}}>Edit</button>
            </div>}
            {alertTickets.length===0
              ?<div className="empty-st"><div className="empty-ico">✅</div><div className="empty-title">All clear</div><div className="empty-sub">No calibration overdue or return warnings. Everything is on schedule.</div></div>
              :<div>
                <div className="sh"><div className="sh-title">Tickets Needing Attention</div><div className="sh-line"/><div className="sh-count">{alertTickets.length} alert{alertTickets.length>1?"s":""}</div></div>
                <div className="tk-wrap">
                  {alertTickets.map(function(t){var g=gauges.filter(function(x){return x.id===t.gaugeId;})[0];return <TicketRow key={t.id} ticket={t} gauge={g} onReturn={handleReturn} onAlert={openAlertModal} settings={settings} isAdmin={isAdmin}/>;})}</div>
                <div style={{marginTop:10,padding:"9px 12px",background:"var(--bg-hover)",border:"1px solid var(--border-main)",borderRadius:8,fontSize:12,color:"var(--text-muted)"}}>
                  Click <b style={{color:"var(--text-dark)"}}>▼ Details</b> on any row to expand the alert ribbon — Gauge No. and Part No. are shown separately in every notification message.
                </div>
              </div>
            }
          </div>
        )}

        {tab==="settings"&&(
          <div>
            <div className="ss">
              <div className="ss-title">Default Admin Email Contact</div>
              <div className="flex-row-mob-col">
                <div className="fl" style={{flex:1,maxWidth:"400px"}}><label>Default Alert Email Address</label><input type="email" value={settings.email} onChange={function(e){setSettings(Object.assign({},settings,{email:e.target.value}));}} placeholder="admin@company.com"/></div>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button className="btn btn-blue" onClick={function(){if(!settings.email){addToast("Enter an email contact.","err","!");return;}addToast("Contacts saved","ok","✓");}}>Save Settings</button>
                {settings.email&&<button className="btn btn-outline-blue" onClick={function(){window.open("mailto:"+settings.email+"?subject=Test — Gauge Room IMS&body=This is a test. Real alerts include Gauge No. and Part No. separately.","_blank");addToast("Test email opened","em","📧");}}>📧 Test Email</button>}
              </div>
            </div>
            <div className="ss">
              <div className="ss-title">Alert Preferences</div>
              {[{k:"emailOn",l:"Email Alerts",s:"Open email client for calibration and return alerts"},{k:"overdueOnly",l:"Overdue Only",s:"Alert only when calibration is overdue, skip due-soon"}].map(function(x){
                return (
                  <div key={x.k} className="tr">
                    <div><div className="trl">{x.l}</div><div className="trs">{x.s}</div></div>
                    <label className="tgl"><input type="checkbox" checked={settings[x.k]} onChange={function(e){setSettings(Object.assign({},settings,{[x.k]:e.target.checked}));}}/><span className="tgl-sl"/></label>
                  </div>
                );
              })}
            </div>
            <div className="ss">
              <div className="ss-title">Alert Trigger Rules</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))",gap:11}}>
                {[{i:"🚨",t:"Calib. Overdue",d:"Past next calibration date.",c:"#dc2626"},{i:"⚠️",t:"Calib. Due ≤ 14 Days",d:"Calibration within 14 days.",c:"#d97706"},{i:"🛑",t:"Usage Limit",d:"Inspection qty limit reached.",c:"#dc2626"},{i:"↩",t:"Return > 30 Days",d:"Gauge held more than 30 days.",c:"#ea580c"},{i:"🔴",t:"Return > 60 Days",d:"Critical — gauge held over 60 days.",c:"#dc2626"}].map(function(r){
                  return <div key={r.t} className="rule-card" style={{borderLeftColor:r.c}}><div style={{fontSize:14,marginBottom:5}}>{r.i}</div><div style={{fontSize:12,fontWeight:700,color:r.c,marginBottom:3}}>{r.t}</div><div style={{fontSize:11,color:"var(--text-muted)"}}>{r.d}</div></div>;
                })}
              </div>
            </div>
          </div>
        )}

        {tab==="audit"&&(
          <div>
            <div className="tb">
              <input className="tbsearch" placeholder="Search audit entries…" value={search} onChange={function(e){setSearch(e.target.value);}}/>
              {audit.length>0&&<button className="btn btn-ghost" onClick={function(){doCSV(audit,"audit.csv");}}>↓ Export</button>}
            </div>
            <div className="sh"><div className="sh-title">Audit Log</div><div className="sh-line"/><div className="sh-count">{audit.length} entries</div></div>
            {audit.length===0
              ?<div className="empty-st"><div className="empty-ico">📜</div><div className="empty-title">No entries yet</div><div className="empty-sub">All actions will appear here — includes Gauge No. and Part No.</div></div>
              :<div className="tw"><table>
                  <thead><tr><th>Time</th><th>Action</th><th>Details</th></tr></thead>
                  <tbody>
                    {audit.filter(function(a){return !search||a.details.toLowerCase().includes(search.toLowerCase())||a.action.toLowerCase().includes(search.toLowerCase());}).map(function(a){
                      return <tr key={a.id}><td style={{color:"var(--text-light)", whiteSpace:"nowrap"}}>{a.timestamp}</td><td><span className={"ae-act aa-"+a.action}>{a.action}</span></td><td style={{color:"var(--text-muted)"}}>{a.details}</td></tr>;
                    })}
                  </tbody>
              </table></div>
            }
          </div>
        )}
      </main>

      {modal==="issue"&&(
        <div className="mo" onClick={function(){setModal(null);}}>
          <div className="md" onClick={function(e){e.stopPropagation();}}>
            <div className="md-title">Raise Issue Ticket <button className="md-close" onClick={function(){setModal(null);}}>✕</button></div>
            {availG.length===0&&<div className="bnr bnr-y" style={{marginBottom:12}}><span>⚠</span><div className="bnr-body"><div className="bnr-text bt-txt-y">No ready gauges. All available gauges may require calibration.</div></div></div>}
            <div className="fg">
              <div className="fl fgf">
                <label>① Part Number *</label>
                <select value={issueF.selectedPartNumber} onChange={function(e){setIssueF(Object.assign({},issueF,{selectedPartNumber:e.target.value,gaugeId:""}));}}>
                  <option value="">— Select a part number —</option>
                  {(function(){
                    var parts=[]; var seen={};
                    availG.forEach(function(g){ var pn=g.partNumber||"__NOPART__"; if(!seen[pn]){seen[pn]=true;parts.push(pn);} });
                    return parts.map(function(pn){ return <option key={pn} value={pn}>{pn==="__NOPART__"?"(No Part Number)":pn}</option>; });
                  })()}
                </select>
              </div>
              <div className="fl fgf">
                <label style={{color:issueF.selectedPartNumber?"var(--text-dark)":"var(--text-light)"}}>② Gauge Number *</label>
                <select value={issueF.gaugeId} onChange={function(e){setIssueF(Object.assign({},issueF,{gaugeId:e.target.value}));}} disabled={!issueF.selectedPartNumber} style={{opacity:issueF.selectedPartNumber?1:0.5,cursor:issueF.selectedPartNumber?"pointer":"not-allowed"}}>
                  <option value="">{issueF.selectedPartNumber?"— Select a gauge number —":"— Select part number first —"}</option>
                  {availG.filter(function(g){return (g.partNumber||"__NOPART__")===issueF.selectedPartNumber;}).map(function(g){
                    return <option key={g.id} value={g.id}>{g.gaugeNumber} — {g.description}</option>;
                  })}
                </select>
              </div>
              {issueF.gaugeId&&(function(){
                var sg=gauges.filter(function(x){return x.id===issueF.gaugeId;})[0];
                if(!sg) return null;
                var used = parseInt(sg.usedQty) || 0;
                var max = parseInt(sg.maxQtyLimit) || 1000;
                var remaining = max - used;
                return (
                  <div className="fl fgf">
                    <div className="ibox grid-2 gap-12 mb-4">
                      <div className="fl"><label>Gauge Name (Description)</label><input value={sg.description} disabled style={{backgroundColor:"var(--bg-hover)", fontWeight:500}}/></div>
                      <div className="fl"><label>Gauge Number</label><input value={sg.gaugeNumber} disabled style={{backgroundColor:"var(--bg-hover)", fontWeight:600}}/></div>
                    </div>
                    <div style={{fontSize:11, color: remaining<=0?"#dc2626":"#16a34a", fontWeight:600, paddingLeft:4}}>
                      Remaining Inspection Capacity: {remaining} pcs (Max Limit: {max})
                    </div>
                  </div>
                );
              })()}
              <div className="fl fgf"><label>No. of Quantity Inspection *</label><input type="number" value={issueF.qtyInspected} onChange={function(e){setIssueF(Object.assign({},issueF,{qtyInspected:e.target.value}));}} placeholder="e.g. 500" min="1"/></div>
              <div className="fl"><label>Entity Name *</label><input value={issueF.entityName} onChange={function(e){setIssueF(Object.assign({},issueF,{entityName:e.target.value}));}} placeholder="Full name"/></div>
              <div className="fl"><label>Employee ID *</label><input value={issueF.employeeId} onChange={function(e){setIssueF(Object.assign({},issueF,{employeeId:e.target.value}));}} placeholder="EMP-XXXX"/></div>
              <div className="fl fgf"><label>Email *</label><input type="email" value={issueF.email} onChange={function(e){setIssueF(Object.assign({},issueF,{email:e.target.value}));}} placeholder="user@company.com"/></div>
              <div className="fl"><label>Department *</label>
                <select value={issueF.department} onChange={function(e){setIssueF(Object.assign({},issueF,{department:e.target.value}));}}>
                  <option value="">— Select department —</option>
                  {DEPTS.map(function(d){return <option key={d}>{d}</option>;})}
                </select>
              </div>
              <div className="fl"><label>Issued Date *</label><input type="date" value={issueF.issuedDate} onChange={function(e){setIssueF(Object.assign({},issueF,{issuedDate:e.target.value}));}}/></div>
            </div>
            <div className="md-actions"><button className="btn btn-ghost" onClick={function(){setModal(null);}}>Cancel</button><button className="btn btn-blue" onClick={handleIssue}>Issue Gauge</button></div>
          </div>
        </div>
      )}

      {modal==="calib"&&selGauge&&(
        <div className="mo" onClick={function(){setModal(null);}}>
          <div className="md" onClick={function(e){e.stopPropagation();}}>
            <div className="md-title">Update Calibration <button className="md-close" onClick={function(){setModal(null);}}>✕</button></div>
            <div className="ibox grid-2 gap-10">
              <div><div style={{fontSize:10,fontWeight:600,color:"var(--text-light)",textTransform:"uppercase",marginBottom:3}}>Gauge No.</div><div style={{fontSize:13,fontWeight:700,color:"#2563eb"}}>{selGauge.gaugeNumber}</div></div>
              <div><div style={{fontSize:10,fontWeight:600,color:"var(--text-light)",textTransform:"uppercase",marginBottom:3}}>Part No.</div><div style={{fontSize:13,fontWeight:700,color:"#7c3aed"}}>{selGauge.partNumber||"—"}</div></div>
              <div style={{gridColumn:"1/-1"}}><div style={{fontSize:10,fontWeight:600,color:"var(--text-light)",textTransform:"uppercase",marginBottom:3}}>Description</div><div style={{fontSize:13, color:"var(--text-main)"}}>{selGauge.description}</div></div>
              <div><div style={{fontSize:10,fontWeight:600,color:"var(--text-light)",textTransform:"uppercase",marginBottom:3}}>Current Next Due</div><div style={{fontSize:13,fontWeight:600,color:calibColor(selGauge.nextCalibrationDate)}}>{fmtDate(selGauge.nextCalibrationDate)}</div></div>
            </div>
            <div className="fg">
              <div className="fl"><label>Last Calibration Date *</label><input type="date" value={calibF.lastCalibrationDate} onChange={function(e){setCalibF(Object.assign({},calibF,{lastCalibrationDate:e.target.value}));}}/></div>
              <div className="fl"><label>Cycle Duration (days) *</label><input type="number" value={calibF.calibrationCycleDays} onChange={function(e){setCalibF(Object.assign({},calibF,{calibrationCycleDays:e.target.value}));}} min={1}/></div>
            </div>
            {previewCalib&&<div className="prev-box">Next calibration due: <b>{fmtDate(previewCalib)}</b></div>}
            <div className="md-actions"><button className="btn btn-ghost" onClick={function(){setModal(null);}}>Cancel</button><button className="btn btn-yellow" onClick={handleCalib}>Update Calibration &amp; Reset Limit</button></div>
          </div>
        </div>
      )}

      {modal==="addGauge"&&(
        <div className="mo" onClick={function(){setModal(null);}}>
          <div className="md" onClick={function(e){e.stopPropagation();}}>
            <div className="md-title">Add New Gauge <button className="md-close" onClick={function(){setModal(null);}}>✕</button></div>
            <div className="bnr bnr-b" style={{marginBottom:13,padding:"8px 12px"}}>
              <span>ℹ</span><div className="bnr-body"><div className="bnr-text bt-txt-b"><b style={{color:"#2563eb"}}>Gauge Number</b> = unique instrument ID. &nbsp;<b style={{color:"#7c3aed"}}>Part Number</b> = the part it belongs to. Both are tracked separately.</div></div>
            </div>
            <div className="fg">
              <div className="fl"><label>Gauge Number * (instrument ID)</label><input value={addF.gaugeNumber} onChange={function(e){setAddF(Object.assign({},addF,{gaugeNumber:e.target.value}));}} placeholder="GR-2024-001"/></div>
              <div className="fl"><label>Part Number (component part)</label><input value={addF.partNumber} onChange={function(e){setAddF(Object.assign({},addF,{partNumber:e.target.value}));}} placeholder="PN-00123"/></div>
              <div className="fl fgf"><label>Description *</label><input value={addF.description} onChange={function(e){setAddF(Object.assign({},addF,{description:e.target.value}));}} placeholder="e.g. Vernier Caliper 0-150mm"/></div>
              <div className="fl"><label>Location</label><input value={addF.location} onChange={function(e){setAddF(Object.assign({},addF,{location:e.target.value}));}} placeholder="Shelf A1"/></div>
              <div className="fl"><label>Max Inspection Qty (Limit)</label><input type="number" value={addF.maxQtyLimit} onChange={function(e){setAddF(Object.assign({},addF,{maxQtyLimit:e.target.value}));}} min="1"/></div>
              <div className="fl"><label>Last Calibration Date *</label><input type="date" value={addF.lastCalibrationDate} onChange={function(e){setAddF(Object.assign({},addF,{lastCalibrationDate:e.target.value}));}}/></div>
              <div className="fl"><label>Cycle Duration (days) *</label><input type="number" value={addF.calibrationCycleDays} onChange={function(e){setAddF(Object.assign({},addF,{calibrationCycleDays:e.target.value}));}} min={1}/></div>
            </div>
            <div className="md-actions"><button className="btn btn-ghost" onClick={function(){setModal(null);}}>Cancel</button><button className="btn btn-blue" onClick={handleAddGauge}>Add to Inventory</button></div>
          </div>
        </div>
      )}

      {alertModal&&<AlertModal gauge={alertModal.gauge} ticket={alertModal.ticket} atype={alertModal.atype} settings={settings} onClose={function(){setAlertModal(null);}} onEmail={sendEmail}/>}
      <ToastStack toasts={toasts} onRemove={removeToast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
